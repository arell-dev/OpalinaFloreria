services:
  mysql:
    image: mysql:8.4
    container_name: opalina-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: opalina
      MYSQL_USER: ${OPALINA_DB_USERNAME:-opalina}
      MYSQL_PASSWORD: ${OPALINA_DB_PASSWORD:-opalina_local}
      MYSQL_ROOT_PASSWORD: ${OPALINA_DB_ROOT_PASSWORD:-opalina_root_local}
    ports:
      - "${OPALINA_DB_PORT:-3307}:3306"
    volumes:
      - opalina_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  opalina_mysql_data:
