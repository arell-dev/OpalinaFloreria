<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>
    <aside class="offcanvas-lg offcanvas-start admin-sidebar" tabindex="-1" id="sidebarAdmin"
        aria-labelledby="sidebarAdminLabel" th:fragment="sidebar(activo)">
        <div class="offcanvas-header d-lg-none">
            <h2 class="offcanvas-title" id="sidebarAdminLabel">Administración</h2>
            <button class="btn-close" type="button" data-bs-dismiss="offcanvas" data-bs-target="#sidebarAdmin"
                aria-label="Cerrar menú"></button>
        </div>

        <div class="offcanvas-body p-0 d-flex flex-column">
            <p class="admin-nav-label">GESTIÓN DE LA TIENDA</p>
            <nav class="list-group list-group-flush p-2" aria-label="Navegación de administración">
                <a class="list-group-item list-group-item-action" th:classappend="${activo == 'pedidos'} ? 'active'" th:aria-current="${activo == 'pedidos'} ? 'page' : null" th:href="@{/admin/pedidos}">
                    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                    Pedidos
                </a>
                <a class="list-group-item list-group-item-action" th:classappend="${activo == 'productos'} ? 'active'"
                    th:aria-current="${activo == 'productos'} ? 'page' : null" th:href="@{/admin/productos}">
                    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true" viewBox="0 0 24 24"><path d="m20 7-8-4-8 4m16 0-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                    Productos
                </a>
                <a class="list-group-item list-group-item-action" th:classappend="${activo == 'clientes'} ? 'active'"
                    th:aria-current="${activo == 'clientes'} ? 'page' : null" th:href="@{/admin/clientes}">
                    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 0 0-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 0 1 5.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 0 1 9.288 0M15 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></svg>
                    Clientes
                </a>
                <a class="list-group-item list-group-item-action" th:classappend="${activo == 'reportes'} ? 'active'"
                    th:aria-current="${activo == 'reportes'} ? 'page' : null" th:href="@{/admin/reportes}">
                    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m0 0V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v10m-6 0a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m0 0V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2"/></svg>
                    Reportes
                </a>
                <a class="list-group-item list-group-item-action"
                    th:classappend="${activo == 'configuracion'} ? 'active'"
                    th:aria-current="${activo == 'configuracion'} ? 'page' : null" th:href="@{/admin/configuracion}">
                    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 0 0 2.572-1.065"/><circle cx="12" cy="12" r="3"/></svg>
                    Configuración
                </a>
                <hr>

                <a class="list-group-item list-group-item-action" th:href="@{/}">
                    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true" viewBox="0 0 24 24"><path d="m10 19-7-7m0 0 7-7m-7 7h18"/></svg>
                    Volver al sitio
                </a>
            </nav>
            <p class="admin-sidebar-note">Opalina Florería<br><span>Piura, Perú</span></p>
        </div>
    </aside>
</body>

</html>
