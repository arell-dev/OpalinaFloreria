<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>
    <th:block th:fragment="footer">
        <footer class="footer-opalina">
            <div class="container py-4">
                <div class="row gy-4">
                    <div class="col-12 col-md-6 col-lg-4">
                        <a class="footer-brand d-inline-flex align-items-center gap-2 text-decoration-none"
                            th:href="@{/}">
                            <img th:src="@{/assets/imagenes/Opalina-Logo.png}" alt="" width="44" height="44">
                            <span class="lh-1">
                                <strong class="d-block">Opalina</strong>
                                <small class="text-uppercase">Florería Piura</small>
                            </span>
                        </a>
                        <p class="lema-pie mt-3 mb-0">Más que flores, emociones.</p>
                    </div>

                    <div class="col-12 col-md-6 col-lg-2">
                        <h6 class="text-uppercase fw-bold">Explorar</h6>
                        <ul class="list-unstyled mb-0 d-grid gap-2">
                            <li><a th:href="@{/catalogo}">Catálogo</a></li>
                            <li><a th:href="@{/nosotros}">Nosotros</a></li>
                            <li><a th:href="@{/contacto}">Contacto</a></li>
                        </ul>
                    </div>

                    <div class="col-12 col-md-6 col-lg-3">
                        <h6 class="text-uppercase fw-bold">Contacto</h6>
                        <ul class="list-unstyled mb-0 d-grid gap-2">
                            <li>
                                <a th:href="|https://wa.me/${configuracionTienda.whatsapp}|" target="_blank" rel="noopener" th:text="${configuracionTienda.telefono}">Teléfono</a>
                            </li>
                            <li>
                                <a th:href="|mailto:${configuracionTienda.email}|" th:text="${configuracionTienda.email}">Correo</a>
                            </li>
                            <li th:text="${configuracionTienda.direccion}">Dirección</li>
                        </ul>
                    </div>

                    <div class="col-12 col-md-6 col-lg-3">
                        <h6 class="text-uppercase fw-bold">Síguenos</h6>
                        <div class="d-flex gap-2">
                            <a class="icono-red" href="https://instagram.com/opalina_piura" target="_blank"
                                rel="noopener" aria-label="Instagram de Opalina">
                                <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true" viewBox="0 0 24 24"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37m1.5-4.87h.01"/></svg>
                            </a>
                            <a class="icono-red" th:href="|https://wa.me/${configuracionTienda.whatsapp}|"
                                target="_blank" rel="noopener" aria-label="WhatsApp de Opalina">
                                <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.8 12.8 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.8 12.8 0 0 0 2.81.7A2 2 0 0 1 22 16.92"/></svg>
                            </a>
                        </div>
                    </div>
                </div>

                <hr class="my-4 border-white opacity-25">

                <div class="d-flex flex-column flex-sm-row justify-content-between gap-2 small">
                    <p class="mb-0">&copy; 2026 Opalina Florería Piura. Todos los derechos reservados.</p>
                    <nav class="d-flex flex-wrap gap-4" aria-label="Enlaces legales">
                        <a th:href="@{/terminos}">Términos y Condiciones</a>
                        <a th:href="@{/privacidad}">Política de Privacidad</a>
                    </nav>
                </div>
            </div>
        </footer>
        <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
    </th:block>
</body>

</html>
