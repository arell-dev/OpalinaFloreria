spring.application.name=opalina
server.port=8080
spring.thymeleaf.cache=false
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${OPALINA_DB_URL:jdbc:mysql://localhost:3307/opalina?useUnicode=true&characterEncoding=utf8&connectionTimeZone=America/Lima}
spring.datasource.username=${OPALINA_DB_USERNAME:opalina}
spring.datasource.password=${OPALINA_DB_PASSWORD:opalina_local}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
opalina.demo-data.enabled=${OPALINA_DEMO_DATA_ENABLED:false}
opalina.almacenamiento.productos.directorio=${OPALINA_UPLOADS_DIR:./uploads/productos}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.resolve-lazily=true
